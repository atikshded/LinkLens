version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: linklens-postgres
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: linklens-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: linklens-backend
    restart: always
    ports:
      - "8081:8081"

    env_file:
      - ./backend/.env

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/linklens

    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: